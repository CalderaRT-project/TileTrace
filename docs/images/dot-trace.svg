<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270"
     role="img" aria-labelledby="title desc">
  <title id="title">tl.dot(q, k_transposed) at [1, 2]</title>
  <desc id="desc">Each grid shows its first four rows and columns. Output cell [1, 2]
    uses all 32 coordinates in row 1 of q and column 2 of k_transposed.</desc>
  <style>
    :root {
      --paper: #f4f8f6; --border: #c9d8d2; --ink: #183731; --muted: #4c6961;
      --cell: #fff; --edge: #b2c7be; --bracket: #7a958b;
      --source-fill: #c3ebda; --source-edge: #4c947a; --source-mark: #18654d;
      --result-fill: #305db0; --result-edge: #234b96; --result-mark: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #14231f; --border: #374f45; --ink: #e6f2eb; --muted: #aac1b5;
        --cell: #20332b; --edge: #435b4e; --bracket: #769084;
        --source-fill: #1f5342; --source-edge: #62b394; --source-mark: #9ae2c3;
        --result-fill: #a5c2ff; --result-edge: #b5ceff; --result-mark: #213861;
      }
    }
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; text-anchor: middle; }
    .name { fill: var(--ink); font-size: 22px; font-weight: 650; }
    .shape, .axes { fill: var(--muted); font-size: 14px; }
    .operator { fill: var(--muted); font-size: 34px; }
    .slice { fill: var(--source-mark); font-size: 18px; font-weight: 600; }
    .result { fill: var(--result-edge); }
  </style>
  <defs>
    <rect id="cell" x="0.5" y="0.5" width="25" height="25" rx="3"
          fill="var(--cell)" stroke="var(--edge)"/>
    <g id="row">
      <use href="#cell"/><use href="#cell" x="31"/><use href="#cell" x="62"/><use href="#cell" x="93"/>
    </g>
    <g id="window">
      <use href="#row"/><use href="#row" y="31"/><use href="#row" y="62"/><use href="#row" y="93"/>
      <path d="M-3 -3h-6v125h6 M122 -3h6v125h-6" fill="none" stroke="var(--bracket)" stroke-width="2"/>
      <g class="axes">
        <text x="13" y="-12">0</text><text x="44" y="-12">1</text>
        <text x="75" y="-12">2</text><text x="106" y="-12">3</text>
        <text x="-24" y="18">0</text><text x="-24" y="49">1</text>
        <text x="-24" y="80">2</text><text x="-24" y="111">3</text>
      </g>
    </g>
    <g id="source">
      <rect x="0.5" y="0.5" width="25" height="25" rx="3" fill="var(--source-fill)" stroke="var(--source-edge)"/>
      <circle cx="13" cy="13" r="3.5" fill="var(--source-mark)"/>
    </g>
    <g id="more" fill="var(--source-mark)">
      <circle r="1.5"/><circle cx="6" r="1.5"/><circle cx="12" r="1.5"/>
    </g>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="269" rx="14" fill="var(--paper)" stroke="var(--border)"/>
  <g transform="translate(101 92)">
    <text class="name" x="60" y="-58">q</text>
    <text class="shape" x="60" y="-37">[16, 32]</text>
    <use href="#window"/>
    <use href="#source" y="31"/><use href="#source" x="31" y="31"/>
    <use href="#source" x="62" y="31"/><use href="#source" x="93" y="31"/>
    <use href="#more" transform="translate(138 44)"/>
    <text class="slice" x="60" y="157">q[1, :]</text>
  </g>
  <text class="operator" x="320" y="162">×</text>
  <g transform="translate(420 92)">
    <text class="name" x="60" y="-58">k_transposed</text>
    <text class="shape" x="60" y="-37">[32, 32]</text>
    <use href="#window"/>
    <use href="#source" x="62"/><use href="#source" x="62" y="31"/>
    <use href="#source" x="62" y="62"/><use href="#source" x="62" y="93"/>
    <use href="#more" transform="translate(75 125) rotate(90)"/>
    <text class="slice" x="60" y="157">k_transposed[:, 2]</text>
  </g>
  <text class="operator" x="640" y="162">=</text>
  <g transform="translate(739 92)">
    <text class="name" x="60" y="-58">tl.dot(…)</text>
    <text class="shape" x="60" y="-37">[16, 32]</text>
    <use href="#window"/>
    <rect x="62.5" y="31.5" width="25" height="25" rx="3" fill="var(--result-fill)" stroke="var(--result-edge)"/>
    <rect x="71.5" y="40.5" width="7" height="7" rx="1" fill="var(--result-mark)"/>
    <text class="slice result" x="60" y="157">[1, 2]</text>
  </g>
</svg>
